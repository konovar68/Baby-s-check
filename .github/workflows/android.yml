name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
      - name: Build APK, run unit tests and lint
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug testDebugUnitTest lintDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/baby-check.apk
          (cd artifacts && sha256sum baby-check.apk > baby-check.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: baby-check-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
  release:
    name: Publish tagged APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baby-check-apk
          path: artifacts
      - name: Publish APK as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/baby-check.apk artifacts/baby-check.apk.sha256 --verify-tag --title "Дневник малыша $RELEASE_TAG" --notes "Тестовая версия для Android 8.0 и новее. Скачайте baby-check.apk из Assets и установите на телефон. Данные хранятся локально; перед сменой версии сохраняйте JSON-выгрузку."
